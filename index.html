<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>برنامج الكاشير</title>
<meta name="theme-color" content="#1565c0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="الكاشير">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body class="locked">
<div id="login">
  <form id="loginForm" autocomplete="off">
    <div class="lock">🔒</div>
    <h2>برنامج الكاشير</h2>
    <p>اكتب كلمة السر عشان تفتح البرنامج</p>
    <input id="pw" type="password" placeholder="كلمة السر" autocomplete="current-password">
    <button class="btn" type="submit">دخول</button>
    <div id="pwErr"></div>
  </form>
</div>
<header>
  <b id="shopTitle">برنامج الكاشير</b>
  <span style="display:flex;gap:12px;align-items:center"><span id="pageTitle"></span><button id="logout" class="btn sm" style="background:#0d47a1" onclick="logout()">🔓 خروج</button></span>
</header>

<nav id="nav">
  <button data-p="products"><span>📦</span>المنتجات</button>
  <button data-p="sales"><span>🧾</span>المبيعات</button>
  <button data-p="purchases"><span>🚚</span>المشتريات</button>
  <button data-p="reports"><span>📊</span>التقارير</button>
  <button data-p="customers"><span>👥</span>العملاء</button>
  <button data-p="settings"><span>⚙️</span>الإعدادات</button>
</nav>

<main id="view"></main>
<div id="modal" class="overlay" hidden></div>

<script src="app.js?v=7"></script>
</body>
</html>
