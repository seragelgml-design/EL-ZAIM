<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تجهيز كلمة السر</title>
<style>
body{font-family:Tahoma,Arial,sans-serif;background:#f2f5fa;max-width:640px;margin:30px auto;padding:0 16px;color:#1d2733;line-height:1.8}
input,button,textarea{font:inherit;width:100%;padding:11px;margin:6px 0;border:1px solid #ccd;border-radius:8px;box-sizing:border-box}
button{background:#1565c0;color:#fff;border:0;cursor:pointer}
button.g{background:#2e7d32}
textarea{direction:ltr;text-align:left;height:90px;background:#fff;font-family:Consolas,monospace;font-size:14px}
.n{color:#c62828}
#msg{min-height:24px;font-weight:700}
ol{padding-right:20px}
</style>
</head>
<body>
<h2>🔑 تجهيز كلمة السر</h2>
<p><b class="n">الصفحة دي للاستخدام على جهازك بس، ماترفعهاش على الاستضافة.</b></p>
<input id="p" type="text" placeholder="اكتب كلمة السر الجديدة هنا" autocomplete="off">
<button id="go" type="button">تجهيز</button>
<div id="msg"></div>
<textarea id="o" readonly placeholder="هنا هيظهر السطرين"></textarea>
<button id="cp" class="g" type="button">📋 نسخ السطرين</button>
<ol>
<li>افتح ملف <b>app.js</b> في أي محرر (Notepad أو VS Code).</li>
<li>في أول الملف دوّر على <b>PASS_SALT</b> و <b>PASS_HASH</b> واستبدل السطرين دول بالسطرين اللي نسختهم من هنا.</li>
<li>احفظ الملف وارفعه على الاستضافة.</li>
</ol>
<script>
/* SHA-256 صغير يشتغل في أي متصفح (حتى لو الصفحة مش https) */
function sha256hex(str) {
  const K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const b = new TextEncoder().encode(str);
  const l = b.length, n = ((l + 9 + 63) >> 6) << 6, m = new Uint8Array(n);
  m.set(b); m[l] = 0x80;
  const dv = new DataView(m.buffer);
  dv.setUint32(n - 8, Math.floor(l * 8 / 4294967296)); dv.setUint32(n - 4, (l * 8) >>> 0);
  let h = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const w = new Array(64);
  const rr = (x, k) => (x >>> k) | (x << (32 - k));
  for (let o = 0; o < n; o += 64) {
    for (let i = 0; i < 16; i++) w[i] = dv.getUint32(o + i * 4);
    for (let i = 16; i < 64; i++) {
      const s0 = rr(w[i-15],7) ^ rr(w[i-15],18) ^ (w[i-15] >>> 3), s1 = rr(w[i-2],17) ^ rr(w[i-2],19) ^ (w[i-2] >>> 10);
      w[i] = (w[i-16] + s0 + w[i-7] + s1) | 0;
    }
    let [a,bb,c,d,e,f,g,hh] = h;
    for (let i = 0; i < 64; i++) {
      const S1 = rr(e,6) ^ rr(e,11) ^ rr(e,25), ch = (e & f) ^ (~e & g), t1 = (hh + S1 + ch + K[i] + w[i]) | 0;
      const S0 = rr(a,2) ^ rr(a,13) ^ rr(a,22), mj = (a & bb) ^ (a & c) ^ (bb & c), t2 = (S0 + mj) | 0;
      hh = g; g = f; f = e; e = (d + t1) | 0; d = c; c = bb; bb = a; a = (t1 + t2) | 0;
    }
    h = [(h[0]+a)|0,(h[1]+bb)|0,(h[2]+c)|0,(h[3]+d)|0,(h[4]+e)|0,(h[5]+f)|0,(h[6]+g)|0,(h[7]+hh)|0];
  }
  return h.map(x => (x >>> 0).toString(16).padStart(8, '0')).join('');
}

function gen() {
  var msg = document.getElementById('msg'), out = document.getElementById('o');
  try {
    var p = document.getElementById('p').value;
    if (!p || p.length < 4) { msg.style.color = '#c62828'; msg.textContent = 'اكتب كلمة سر من 4 حروف أو أرقام على الأقل (الأفضل 8 أو أكتر)'; out.value = ''; return; }
    var salt = '';
    var arr = new Uint8Array(8);
    if (window.crypto && crypto.getRandomValues) crypto.getRandomValues(arr); else for (var i = 0; i < 8; i++) arr[i] = Math.floor(Math.random() * 256);
    for (var j = 0; j < arr.length; j++) salt += ('0' + arr[j].toString(16)).slice(-2);
    out.value = "  PASS_SALT: '" + salt + "',\n  PASS_HASH: '" + sha256hex(salt + p) + "',";
    msg.style.color = '#2e7d32'; msg.textContent = 'تمام ✅ انسخ السطرين اللي تحت وحطهم في app.js';
  } catch (e) { msg.style.color = '#c62828'; msg.textContent = 'حصل خطأ: ' + e.message; }
}
document.getElementById('go').onclick = gen;
document.getElementById('p').onkeydown = function (e) { if (e.key === 'Enter') gen(); };
document.getElementById('cp').onclick = function () {
  var o = document.getElementById('o'); if (!o.value) return gen();
  o.select();
  try { document.execCommand('copy'); document.getElementById('msg').style.color = '#2e7d32'; document.getElementById('msg').textContent = 'اتنسخ ✅'; } catch (e) {}
};
</script>
</body>
</html>
